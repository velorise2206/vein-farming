name: Build Vein Farming All Loaders

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  forge-1-20-1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 1.20.1/forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: vein-farming-1.20.1-forge
          path: 1.20.1/forge/build/libs/*.jar

