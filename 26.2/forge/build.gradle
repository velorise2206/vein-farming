plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '7.0.40'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "vein_farming-26.2-forge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    minecraft.mavenizer(repositories)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

minecraft {
    mappings('official', minecraft_version)
    runs {
        client {
            workingDir.set(project.file('run'))
        }
        server {
            workingDir.set(project.file('run'))
        }
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : mod_authors
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets.main.java {
    srcDir file('../common/src/main/java')
}

sourceSets.main.resources {
    srcDir file('../common/src/main/resources')
}

sourceSets.configureEach {
    def dir = layout.buildDirectory.dir('sourcesSets/' + it.name)
    it.output.resourcesDir = dir.get().asFile
    it.java.destinationDirectory.set(dir)
}

tasks.named('processResources').configure {
    mustRunAfter(tasks.named('compileJava'))
    doNotTrackState('Shares output directory with compileJava')
}
